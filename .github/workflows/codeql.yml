name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    paths-ignore:
    - '**/*.md'
    - '**/*.txt'
  schedule:
    - cron: '43 10 * * 2'

jobs:
  analyze:
    name: Analyze

    runs-on: [ubuntu-22.04]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    
    - name: Checkout repository
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
      with:
        languages: ${{ matrix.language }}
	setup: advanced
      
    - name: Update permissions
      run: sudo chmod +x ./.github/workflows/scripts/install_prereqs.cmd
      shell: bash
      
    - name: Run dependencies
      run: sudo ./.github/workflows/scripts/install_prereqs.cmd
      shell: bash
      
    - name: Update permissions
      run: sudo chmod +x ./.github/workflows/scripts/buildcode.cmd
      shell: bash
      
    - name: Build code
      run: ./.github/workflows/scripts/buildcode.cmd
      shell: bash

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
